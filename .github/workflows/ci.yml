name: Validation

on:
  push:
  pull_request:

# This workflow only reads the repository. It has no publishing credentials,
# release step, or trusted-code path for pull requests.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e ".[test]"

      - name: Validate JSON metadata
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/agentic_home/manifest.json >/dev/null
          python -m json.tool custom_components/agentic_home/strings.json >/dev/null
          python -m json.tool custom_components/agentic_home/translations/en.json >/dev/null

      - name: Validate HACS layout and brand asset
        run: |
          test "$(find custom_components -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test -f custom_components/agentic_home/manifest.json
          test -f brand/icon.png

      - name: Run integration tests
        run: python -m pytest -q custom_components/agentic_home/tests
