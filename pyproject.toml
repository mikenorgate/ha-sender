[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-sender"
version = "0.1.0"
description = "Agentic Home Home Assistant custom integration"
requires-python = ">=3.13,<3.15"
dependencies = []

[project.optional-dependencies]
test = [
  "bcrypt==5.0.0",
  "homeassistant==2026.5.4",
  "pytest-homeassistant-custom-component==0.13.333",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["custom_components/agentic_home/tests"]
pythonpath = ["."]
filterwarnings = ["ignore::pytest.PytestRemovedIn9Warning"]
